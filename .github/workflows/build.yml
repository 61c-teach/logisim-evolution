# 61C build: produces the course jar as a workflow artifact on every push/PR to develop.
name: "Build"
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

env:
  JDK_VERSION: 21
  JDK_DISTRO: 'temurin'
jobs:
  build:
    name: "Gradle builder"
    runs-on: ubuntu-latest
    steps:
    - name: "Checkout sources"
      uses: actions/checkout@v4
    - name: Set up JDK ${{ env.JDK_VERSION }} ${{ env.JDK_DISTRO }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JDK_VERSION }}
        distribution: ${{ env.JDK_DISTRO }}
        cache: gradle
    - name: Set version var
      run: sed -i -e "s/61c.dev/61c.$(echo ${GITHUB_SHA} | cut -c1-7)/" gradle.properties
    - name: "Build with Gradle"
      run: |
        chmod +x gradlew
        ./gradlew shadowJar -x checkstyleMain -x checkstyleTest
    - name: Post artifacts
      uses: actions/upload-artifact@v4
      with:
        name: jar
        path: build/libs/*.jar
